repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.1
    hooks:
      - id: ruff
        exclude: ^(databricks)/.*\.py$
        args: [ --fix ]
      - id: ruff-format
        exclude: ^(databricks)/.*\.py$


  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
    - id: mypy
      exclude: ^(databricks)/.*\.py$
      args: [--check-untyped-def, --ignore-missing-import]


  - repo: local
    hooks:
      - id: vulture
        exclude: ^(databricks)/.*\.py$
        name: vulture
        entry: vulture
        language: python
        types: [python]
        args: [--min-confidence, "65"]